<!DOCTYPE html>
<html>
<head>
  <title>Kalkulator Keuntungan Bitcoin</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f2f2f2;
    }
    .container {
      max-width: 400px;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    label, input {
      display: block;
      margin-bottom: 10px;
      width: 100%;
    }
    input {
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      padding: 10px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    #result {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Kalkulator Untung Bitcoin</h2>
    <label for="modal">Modal (Rp)</label>
    <input type="number" id="modal" placeholder="Contoh: 5000000">

    <label for="hargaBeli">Harga Beli BTC ($)</label>
    <input type="number" id="hargaBeli" placeholder="Contoh: 77000">

    <label for="hargaSekarang">Harga BTC Sekarang ($)</label>
    <input type="number" id="hargaSekarang" placeholder="Contoh: 105000">

    <label for="kurs">Kurs USD ke IDR</label>
    <input type="number" id="kurs" value="15000">

    <button onclick="hitungUntung()">Hitung</button>

    <div id="result"></div>
  </div>

  <script>
    function hitungUntung() {
      const modal = parseFloat(document.getElementById("modal").value);
      const hargaBeli = parseFloat(document.getElementById("hargaBeli").value);
      const hargaSekarang = parseFloat(document.getElementById("hargaSekarang").value);
      const kurs = parseFloat(document.getElementById("kurs").value);

      const usd = modal / kurs;
      const btc = usd / hargaBeli;
      const nilaiSekarang = btc * hargaSekarang * kurs;
      const untung = nilaiSekarang - modal;

      document.getElementById("result").innerHTML = `
        Jumlah BTC: ${btc.toFixed(6)}<br>
        Nilai Sekarang: Rp${Math.round(nilaiSekarang).toLocaleString()}<br>
        Keuntungan: Rp${Math.round(untung).toLocaleString()}
      `;
    }
  </script>
</body>
</html>
